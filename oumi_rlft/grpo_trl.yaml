## Oumi RL fine-tuning recipe (GRPO via TRL)
#
# Run (from hack01/):
#   pip install "oumi[trl]"
#   oumi train -c oumi_rlft/grpo_trl.yaml
#
# Docs:
# - GRPO training method (Oumi): https://www.oumi.ai/docs/en/latest/user_guides/train/training_methods.html#group-relative-policy-optimization-grpo
# - TRL GRPOConfig: https://huggingface.co/docs/trl/main/en/grpo_trainer#trl.GRPOConfig
#
# Notes:
# - GRPO/RLFT typically benefits from a GPU.
# - `use_vllm` can speed up rollouts, but requires vLLM installed/configured.

model:
  model_name: "Qwen/Qwen2-0.5B-Instruct"
  trust_remote_code: true
  dtype: "bfloat16"

data:
  train:
    datasets:
      - dataset_name: "trl-lib/tldr"
        split: "train"

training:
  trainer_type: "TRL_GRPO"
  output_dir: "output/grpo_tldr_qwen2_0_5b"
  max_steps: 30
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  logging_steps: 5
  save_steps: 30
  # Reward functions are looked up in Oumi's reward function registry.
  # This one is referenced in Oumi's GRPO docs.
  reward_functions: ["soft_20tokens_completions"]
  grpo:
    use_vllm: false


